{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 mt-4">
            <h3 class="text-center mb-4">Join SkillSakhi</h3>
            <form action="/register" method="POST">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-control" placeholder="Jane Doe" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Skills You Can Teach (Comma separated)</label>
                    <input type="text" name="teaches" class="form-control" placeholder="Python, Cooking, Yoga">
                </div>
                <div class="mb-3">
                    <label class="form-label">Skills You Want to Learn</label>
                    <input type="text" name="learns" class="form-control" placeholder="Marketing, Guitar">
                </div>
                <button type="submit" class="btn btn-primary w-100">Create Account</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
