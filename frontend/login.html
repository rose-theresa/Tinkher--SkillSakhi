{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm p-4 border-0" style="border-radius: 15px;">
            <h3 class="text-center text-purple mb-4">Login to SkillSakhi</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="enter your email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="enter your password" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-purple py-2">Sign In</button>
                </div>
            </form>
            <div class="mt-3 text-center">
                <p class="small">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
